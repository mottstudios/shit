<title>Everything Turns to Shit</title>

<style>
  :root {
    color-scheme: light;
    --ink: #121212;
    --paper: #ffffff;
    --rule: #d3d6da;
    --filled: #878a8c;
    --key: #d3d6da;
    --key-hover: #c4c7cb;
    --muted: #6a6d70;
    --brown: #5b3a1e;
    --active: #dbc4b2;
    --flush: #b9dff5;
    --flush-hover: #a3d3ef;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Libre Franklin", "Franklin Gothic Medium", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-inline: 16px;
    box-sizing: border-box;
  }
  header {
    width: 100%;
    max-width: 500px;
    border-bottom: 1px solid var(--rule);
    padding-block: 14px 10px;
    text-align: center;
  }
  h1 {
    font-family: "Arvo", Rockwell, "Rockwell Bold", "Roboto Slab", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.45rem, 6vw, 2.1rem);
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .sub {
    margin: 6px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .sub b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

  main {
    flex: 1;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-block: 18px 12px;
    position: relative;
  }
  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    width: min(260px, calc(60% - 16px));
  }
  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .row.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .tile {
    aspect-ratio: 1;
    max-width: 100%;
    border: 2px solid var(--rule);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: clamp(1.4rem, 7vw, 2rem);
    text-transform: uppercase;
    user-select: none;
    box-sizing: border-box;
  }
  .tile.filled { border-color: var(--filled); }
  .tile.locked { border-color: var(--filled); }
  .row.active .tile { background: var(--active); }
  .row.won .tile { background: var(--brown); border-color: var(--brown); color: #fff; }

  #toast {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 12px 16px;
    border-radius: 4px;
    z-index: 5;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  #end {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #end p { margin: 0; font-size: 0.95rem; line-height: 1.45; }
  #end .path { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .again {
    background: var(--ink);
    color: var(--paper);
    border: 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 12px 28px;
  }
  .flush {
    background: var(--flush);
    color: var(--ink);
    border: 0;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    padding: 10px 0;
    position: absolute;
    right: 0;
    width: 20%;
    z-index: 2;
  }
  .flush:hover { background: var(--flush-hover); }
  .link {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: underline;
    padding: 4px;
  }

  #keyboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .krow { display: flex; gap: 6px; justify-content: center; }
  .krow.mid { padding-inline: 5%; }
  .key {
    flex: 1;
    height: 58px;
    border: 0;
    border-radius: 4px;
    background: var(--key);
    color: var(--ink);
    font-weight: 700;
    font-size: 1.1rem;
    text-transform: uppercase;
    display: grid;
    place-items: center;
    padding: 0;
    min-width: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .key:hover { background: var(--key-hover); }
  .key.wide { flex: 1.5; font-size: 0.72rem; }
  .key svg { width: 22px; height: 22px; }
  @media (prefers-reduced-motion: reduce) { .row.shake { animation: none; } }
</style>

const TARGET = 'shit';
const SFX = { flush: new Audio('flush.mp3'), win: new Audio('fart-fanfare.mp3') };
function play(name) {
  const a = SFX[name];
  try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
}
const ROWS = 6;
const $ = id => document.getElementById(id);

function neighbors(w, set) {
  const out = [];
  for (let i = 0; i < 4; i++)
    for (let c = 97; c < 123; c++) {
      const x = w.slice(0, i) + String.fromCharCode(c) + w.slice(i + 1);
      if (x !== w && set.has(x)) out.push(x);
    }
  return out;
}
function shortestPath(from, set) {
  const prev = { [from]: null }, q = [from];
  for (let k = 0; k < q.length; k++) {
    const w = q[k];
    if (w === TARGET) {
      const p = []; for (let x = w; x; x = prev[x]) p.unshift(x); return p;
    }
    for (const x of neighbors(w, set)) if (!(x in prev)) { prev[x] = w; q.push(x); }
  }
  return null;
}
const diffCount = (a, b) => [...a].filter((ch, i) => ch !== b[i]).length;

let rows, cur, typed, over;

const board = $('board');
function buildBoard() {
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    for (let c = 0; c < 4; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
    }
    board.appendChild(row);
  }
}
function render() {
  [...board.children].forEach((row, r) => {
    const word = r < cur ? rows[r] : r === cur ? typed : '';
    row.classList.toggle('won', r < cur && rows[r] === TARGET);
    row.classList.toggle('active', r === cur && !over);
    [...row.children].forEach((t, c) => {
      t.textContent = word[c] || '';
      t.className = 'tile';
      if (r < cur) {
        t.classList.add('locked');
      } else if (word[c]) t.classList.add('filled');
    });
  });
  $('flush').hidden = rows.length < 2 || rows[rows.length - 1] === TARGET;
  placeFlush();
}
// FLUSH sits level with the start word, over the O/P keys (right fifth of the keyboard).
function placeFlush() {
  const btn = $('flush'), first = board.children[0];
  if (btn.hidden || !first) return;
  btn.style.top = (first.offsetTop + (first.offsetHeight - btn.offsetHeight) / 2) + 'px';
}
window.addEventListener('resize', placeFlush);
document.fonts && document.fonts.ready.then(placeFlush);

let toastTimer;
function toast(msg, ms = 1600) {
  const el = $('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function shake() {
  const row = board.children[cur];
  row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
}

function submit() {
  if (typed.length < 4) { toast('Four letters, please'); shake(); return; }
  const prev = rows[cur - 1];
  const d = diffCount(typed, prev);
  if (d === 0) { toast('Change one letter'); shake(); return; }
  if (d > 1) { toast('Only one letter at a time'); shake(); return; }
  if (!VALID.has(typed)) { toast('Not in word list'); shake(); return; }
  if (rows.includes(typed)) { toast('Already used that one'); shake(); return; }
  rows.push(typed); cur++; typed = '';
  save();
  render();
  if (rows[cur - 1] === TARGET) { play('win'); finish(true); }
  else if (cur >= ROWS) finish(false);
}

function finish(won) {
  over = true;
  render();
  const moves = rows.length - 1, par = shortestPath(rows[0], COMMON).length - 1;
  if (won) {
    $('endmsg').textContent =
      moves <= par ? `Everything turned to shit in ${moves}. That's par.`
                   : `Everything turned to shit in ${moves}. Par was ${par}.`;
    $('endpath').textContent = '';
  } else {
    const p = shortestPath(rows[0], COMMON);
    $('endmsg').textContent = 'Out of rows. It could have gone like this:';
    $('endpath').textContent = p.join(' › ');
  }
  $('end').hidden = false;
  $('keyboard').hidden = true;
}

// Daily puzzle: a fixed shuffle of STARTS, one per local calendar day from launch.
const LAUNCH = Date.UTC(2026, 8, 25);
function dayIndex() {
  const d = new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 86400000);
}
function shuffled(list, seed) {
  const a = list.slice();
  let t = seed;
  const rand = () => {
    t = (t + 0x6D2B79F5) | 0;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const ORDER = shuffled(STARTS, 20260925);
const DAY = dayIndex();
const SAVE_KEY = 'etts-day-' + DAY;

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(rows)); } catch (e) {}
}
function load(start) {
  try {
    const r = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (Array.isArray(r) && r[0] === start && r.length <= ROWS) return r;
  } catch (e) {}
  return [start];
}

function startDay() {
  const start = ORDER[((DAY % ORDER.length) + ORDER.length) % ORDER.length];
  rows = load(start); cur = rows.length; typed = ''; over = false;
  $('par').textContent = shortestPath(start, COMMON).length - 1;
  render();
  if (rows[cur - 1] === TARGET) finish(true);
  else if (cur >= ROWS) finish(false);
}

function press(k) {
  if (over) return;
  if (k === 'enter') submit();
  else if (k === 'back') typed = typed.slice(0, -1);
  else if (/^[a-z]$/.test(k) && typed.length < 4) typed += k;
  render();
}

const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H8l-6 7 6 7h13z"/><path d="M11 9l6 6M17 9l-6 6"/></svg>';
function buildKeyboard() {
  const kb = $('keyboard');
  ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'].forEach((line, i) => {
    const row = document.createElement('div');
    row.className = 'krow' + (i === 1 ? ' mid' : '');
    for (const ch of line) {
      const b = document.createElement('button');
      b.className = 'key';
      b.type = 'button';
      if (ch === '+') { b.textContent = 'Enter'; b.classList.add('wide'); b.dataset.k = 'enter'; }
      else if (ch === '-') { b.innerHTML = BACK_SVG; b.classList.add('wide'); b.dataset.k = 'back'; b.setAttribute('aria-label', 'Backspace'); }
      else { b.textContent = ch; b.dataset.k = ch; }
      row.appendChild(b);
    }
    kb.appendChild(row);
  });
  kb.addEventListener('click', e => {
    const b = e.target.closest('.key');
    if (b) { press(b.dataset.k); b.blur(); }
  });
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') {
    if (e.target.closest && e.target.closest('button:not(.key)')) return;
    press('enter'); e.preventDefault();
  } else if (e.key === 'Backspace') press('back');
  else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toLowerCase());
});

$('flush').addEventListener('click', e => {
  play('flush');
  rows = [rows[0]]; cur = 1; typed = ''; over = false;
  save();
  $('end').hidden = true;
  $('keyboard').hidden = false;
  render();
  e.currentTarget.blur();
});

buildBoard();
buildKeyboard();
startDay();
</script>
